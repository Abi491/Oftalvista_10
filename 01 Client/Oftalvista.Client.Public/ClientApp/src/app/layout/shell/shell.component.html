<mat-sidenav-container style="height:100vh">
  <mat-sidenav mode="side" opened style="width:240px; background:#3f51b5;">
    <div style="padding:20px 16px; color:#fff;">
      <mat-icon style="font-size:40px; width:40px; height:40px;">visibility</mat-icon>
      <h3 style="margin:8px 0 4px">Oftalvista</h3>
      <small>{{ user?.nombreCompleto }}</small>
    </div>
    <mat-divider></mat-divider>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of menu" [routerLink]="item.route" routerLinkActive="active-link">
        <mat-icon matListItemIcon style="color:#fff">{{ item.icon }}</mat-icon>
        <span matListItemTitle style="color:#fff">{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span class="spacer"></span>
      <span style="font-size:14px; margin-right:12px">{{ user?.nombreCompleto }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
