<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#3f51b5 0%,#7986cb 100%)">
  <mat-card style="width:380px; padding:32px">
    <div style="text-align:center; margin-bottom:24px">
      <mat-icon style="font-size:56px; width:56px; height:56px; color:#3f51b5">visibility</mat-icon>
      <h2 style="margin:8px 0 4px; color:#3f51b5">Oftalvista</h2>
      <small style="color:#666">Sistema de Gestión de Citas</small>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput formControlName="correo" type="email" autocomplete="email">
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="form.get('correo')?.hasError('required')">El correo es obligatorio</mat-error>
        <mat-error *ngIf="form.get('correo')?.hasError('email')">Ingrese un correo válido</mat-error>
      </mat-form-field>

      <mat-form-field class="full-width" appearance="outline" style="margin-top:12px">
        <mat-label>Contraseña</mat-label>
        <input matInput formControlName="claveHash" [type]="hidePass ? 'password' : 'text'" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePass=!hidePass">
          <mat-icon>{{ hidePass ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('claveHash')?.hasError('required')">La contraseña es obligatoria</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width" style="margin-top:20px; height:44px" type="submit" [disabled]="loading">
        <mat-spinner *ngIf="loading" diameter="20" style="display:inline-block; margin-right:8px"></mat-spinner>
        {{ loading ? "Ingresando..." : "Ingresar" }}
      </button>
    </form>
  </mat-card>
</div>
