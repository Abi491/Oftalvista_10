<div class="page-container">
  <h2 style="margin-bottom:24px; color:#3f51b5">Panel de Administración</h2>
  <div style="display:grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap:16px">
    <mat-card *ngFor="let a of accesos" (click)="ir(a.route)"
      style="cursor:pointer; text-align:center; padding:24px; transition:box-shadow .2s"
      [style.border-top]="'4px solid ' + a.color">
      <mat-icon [style.color]="a.color" style="font-size:40px; width:40px; height:40px">{{ a.icon }}</mat-icon>
      <p style="margin:12px 0 0; font-weight:500">{{ a.label }}</p>
    </mat-card>
  </div>
</div>
