<h2 mat-dialog-title>{{ esEdicion ? "Editar" : "Nuevo" }} Paciente</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid" style="margin-top:8px">
    <mat-form-field appearance="outline">
      <mat-label>ID Usuario</mat-label>
      <input matInput type="number" formControlName="idUsuario">
      <mat-hint>Ingrese el ID de un usuario tipo Paciente</mat-hint>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Sexo</mat-label>
      <mat-select formControlName="sexo">
        <mat-option value="M">Masculino</mat-option>
        <mat-option value="F">Femenino</mat-option>
      </mat-select>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha Nacimiento</mat-label>
      <input matInput type="date" formControlName="fechaNacimiento">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Teléfono Emergencia</mat-label>
      <input matInput formControlName="telefonoEmergencia">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Contacto Emergencia</mat-label>
      <input matInput formControlName="contactoEmergencia">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
    {{ loading ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
