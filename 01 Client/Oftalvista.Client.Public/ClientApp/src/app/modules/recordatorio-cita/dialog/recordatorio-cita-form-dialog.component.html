<h2 mat-dialog-title>{{ esEdicion ? "Editar" : "Nuevo" }} Recordatorio</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid" style="margin-top:8px">
    <mat-form-field appearance="outline">
      <mat-label>ID Cita</mat-label>
      <input matInput type="number" formControlName="idCita">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="idEstadoRecordatorio">
        <mat-option *ngFor="let e of estados" [value]="e.value">{{ e.text }}</mat-option>
      </mat-select>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha Programada</mat-label>
      <input matInput type="datetime-local" formControlName="fechaProgramada">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha Envío</mat-label>
      <input matInput type="datetime-local" formControlName="fechaEnvio">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Mensaje</mat-label>
      <textarea matInput formControlName="mensaje" rows="3"></textarea>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
    {{ loading ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
