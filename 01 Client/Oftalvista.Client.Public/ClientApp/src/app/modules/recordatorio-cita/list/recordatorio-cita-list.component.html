<div class="page-container">
  <div class="action-bar">
    <h2>Recordatorios de Citas</h2>
    <button mat-flat-button color="primary" (click)="abrirForm()"><mat-icon>add</mat-icon> Nuevo Recordatorio</button>
  </div>
  <mat-card style="margin-bottom:16px;padding:16px">
    <div class="filter-row" [formGroup]="filtros">
      <mat-form-field appearance="outline"><mat-label>ID Cita</mat-label><input matInput formControlName="idCita"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Desde</mat-label><input matInput type="date" formControlName="fechaRegistroDesde"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Hasta</mat-label><input matInput type="date" formControlName="fechaRegistroHasta"></mat-form-field>
      <button mat-flat-button color="primary" (click)="buscar()"><mat-icon>search</mat-icon> Buscar</button>
      <button mat-stroked-button (click)="limpiar()"><mat-icon>clear</mat-icon> Limpiar</button>
    </div>
  </mat-card>
  <div style="position:relative">
    <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="40"
      style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10"></mat-progress-spinner>
    <table mat-table [dataSource]="data" class="mat-elevation-z2">
      <ng-container matColumnDef="rowNum"><th mat-header-cell *matHeaderCellDef>#</th><td mat-cell *matCellDef="let r">{{r.rowNum}}</td></ng-container>
      <ng-container matColumnDef="idCita"><th mat-header-cell *matHeaderCellDef>ID Cita</th><td mat-cell *matCellDef="let r">{{r.idCita}}</td></ng-container>
      <ng-container matColumnDef="idEstadoRecordatorio">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span style="padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500"
            [style.background]="r.idEstadoRecordatorio===2?'#e8f5e9':r.idEstadoRecordatorio===3?'#fce4ec':'#e3f2fd'"
            [style.color]="r.idEstadoRecordatorio===2?'#2e7d32':r.idEstadoRecordatorio===3?'#c62828':'#1565c0'">
            {{getEstado(r.idEstadoRecordatorio)}}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="fechaProgramada"><th mat-header-cell *matHeaderCellDef>F. Programada</th><td mat-cell *matCellDef="let r">{{r.fechaProgramada}}</td></ng-container>
      <ng-container matColumnDef="fechaEnvio"><th mat-header-cell *matHeaderCellDef>F. Envío</th><td mat-cell *matCellDef="let r">{{r.fechaEnvio ?? "-"}}</td></ng-container>
      <ng-container matColumnDef="mensaje"><th mat-header-cell *matHeaderCellDef>Mensaje</th>
        <td mat-cell *matCellDef="let r" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" [matTooltip]="r.mensaje">{{r.mensaje}}</td>
      </ng-container>
      <ng-container matColumnDef="idTblEstadoVigencia">
        <th mat-header-cell *matHeaderCellDef>Vigencia</th>
        <td mat-cell *matCellDef="let r"><span [class]="r.idTblEstadoVigencia===1?'chip-activo':'chip-inactivo'" style="padding:4px 10px;border-radius:12px;font-size:12px">{{r.idTblEstadoVigencia===1?"Activo":"Inactivo"}}</span></td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="primary" (click)="abrirForm(r)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="eliminar(r)" matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
    <mat-paginator [length]="total" [pageSize]="pageSize" [pageSizeOptions]="[5,10,25,50]" (page)="onPage($event)" #paginator></mat-paginator>
  </div>
</div>
