<h2 mat-dialog-title>{{ esEdicion ? "Editar" : "Nueva" }} Especialidad Médica</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid" style="margin-top:8px">
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo">
      <mat-error>Campo obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
      <mat-error>Campo obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="3"></textarea>
      <mat-error>Campo obligatorio</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
    {{ loading ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
