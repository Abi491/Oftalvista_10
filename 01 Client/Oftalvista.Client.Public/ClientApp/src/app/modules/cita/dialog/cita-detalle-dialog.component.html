<h2 mat-dialog-title>Detalle de Cita</h2>
<mat-dialog-content>
  <div *ngIf="cita; else loading">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
      <div><small style="color:#666">Paciente ID</small><p style="margin:0;font-weight:500">{{cita.idPaciente}}</p></div>
      <div><small style="color:#666">Médico ID</small><p style="margin:0;font-weight:500">{{cita.idMedico}}</p></div>
      <div><small style="color:#666">Fecha</small><p style="margin:0;font-weight:500">{{cita.fechaCita}}</p></div>
      <div><small style="color:#666">Hora</small><p style="margin:0;font-weight:500">{{cita.horaCita}}</p></div>
      <div><small style="color:#666">Estado</small><p style="margin:0;font-weight:500">{{getEstado(cita.idEstadoCita)}}</p></div>
      <div><small style="color:#666">Modalidad</small><p style="margin:0;font-weight:500">{{getModalidad(cita.idModalidadCita)}}</p></div>
      <div style="grid-column:span 2"><small style="color:#666">Motivo</small><p style="margin:0;font-weight:500">{{cita.motivo}}</p></div>
      <div style="grid-column:span 2" *ngIf="cita.observacion"><small style="color:#666">Observación</small><p style="margin:0">{{cita.observacion}}</p></div>
    </div>
  </div>
  <ng-template #loading>
    <div style="text-align:center;padding:24px"><mat-spinner diameter="36"></mat-spinner></div>
  </ng-template>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button (click)="ref.close()">Cerrar</button>
</mat-dialog-actions>
