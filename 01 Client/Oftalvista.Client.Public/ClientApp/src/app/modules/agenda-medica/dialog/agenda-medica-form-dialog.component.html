<h2 mat-dialog-title>{{ esEdicion ? "Editar" : "Nuevo" }} Slot de Agenda</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid" style="margin-top:8px">
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Médico</mat-label>
      <mat-select formControlName="idMedico">
        <mat-option *ngFor="let m of data.medicos" [value]="m.value">{{ m.text }}</mat-option>
      </mat-select>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" formControlName="fecha">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Hora Inicio</mat-label>
      <input matInput type="time" formControlName="horaInicio">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Hora Fin</mat-label>
      <input matInput type="time" formControlName="horaFin">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 0">
      <mat-slide-toggle formControlName="esDisponible">Disponible</mat-slide-toggle>
    </div>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Observación</mat-label>
      <textarea matInput formControlName="observacion" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
    {{ loading ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
