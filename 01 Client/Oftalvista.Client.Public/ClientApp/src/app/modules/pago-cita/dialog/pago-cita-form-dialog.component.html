<h2 mat-dialog-title>{{ esEdicion ? "Editar" : "Registrar" }} Pago</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid" style="margin-top:8px">
    <mat-form-field appearance="outline">
      <mat-label>ID Cita</mat-label>
      <input matInput type="number" formControlName="idCita">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Monto (S/)</mat-label>
      <input matInput type="number" formControlName="monto" step="0.01">
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Método de Pago</mat-label>
      <mat-select formControlName="idMetodoPago">
        <mat-option *ngFor="let m of metodos" [value]="m.value">{{ m.text }}</mat-option>
      </mat-select>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Estado de Pago</mat-label>
      <mat-select formControlName="idEstadoPago">
        <mat-option *ngFor="let e of estados" [value]="e.value">{{ e.text }}</mat-option>
      </mat-select>
      <mat-error>Obligatorio</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha de Pago</mat-label>
      <input matInput type="date" formControlName="fechaPago">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nro. Operación</mat-label>
      <input matInput formControlName="numeroOperacion">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-col">
      <mat-label>Comprobante</mat-label>
      <input matInput formControlName="comprobante">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close(false)" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
    {{ loading ? "Guardando..." : "Guardar" }}
  </button>
</mat-dialog-actions>
